{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Winter Olympics Schedule</title>
    <link rel="stylesheet" href="{% static 'schedule/styles.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header>
        <h1>2026 Milano Cortina Winter Olympics</h1>
        <div class="header-actions">
            <button id="jump-to-now" class="btn" title="Jump to current/next event">
                ⏱ Now
            </button>
            <button
                hx-post="{% url 'schedule:refresh' %}"
                hx-target="#refresh-status"
                hx-swap="innerHTML"
                hx-indicator="#refresh-spinner"
                class="btn refresh-btn"
            >
                <span id="refresh-spinner" class="htmx-indicator">...</span>
                Refresh
            </button>
        </div>
    </header>

    <div id="refresh-status"></div>

    <form id="filters" hx-get="{% url 'schedule:index' %}" hx-target="#schedule-table" hx-trigger="change" hx-push-url="true">
        <div class="filter-row">
            <label>
                Sport:
                <select name="discipline">
                    <option value="">All Sports</option>
                    {% for d in disciplines %}
                    <option value="{{ d.code }}" {% if d.code == current_discipline %}selected{% endif %}>{{ d.name }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>
                Country:
                <select name="country">
                    <option value="">All Countries</option>
                    {% for c in countries %}
                    <option value="{{ c.code }}" {% if c.code == current_country %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>
                Date:
                <select name="date">
                    <option value="">All Dates</option>
                    {% for d in dates %}
                    <option value="{{ d|date:'Y-m-d' }}" {% if d|date:'Y-m-d' == current_date %}selected{% endif %}>{{ d|date:'D, M j' }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>
                Status:
                <select name="status">
                    <option value="">All</option>
                    <option value="LIVE" {% if current_status == 'LIVE' %}selected{% endif %}>Live Now</option>
                    <option value="UPCOMING" {% if current_status == 'UPCOMING' %}selected{% endif %}>Upcoming</option>
                    <option value="FINISHED" {% if current_status == 'FINISHED' %}selected{% endif %}>Finished</option>
                </select>
            </label>

            <label class="checkbox-label">
                <input type="checkbox" name="medal" value="1" {% if medal_only %}checked{% endif %}>
                Medal Events Only
            </label>
        </div>
    </form>

    <div id="schedule-table">
        {% include "schedule/_table.html" %}
    </div>

    <script>
        // Format dates using browser locale
        function formatDates() {
            const dateFormatter = new Intl.DateTimeFormat(undefined, { month: 'numeric', day: 'numeric' });
            const timeFormatter = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });

            document.querySelectorAll('.time[data-datetime]').forEach(cell => {
                const dt = new Date(cell.dataset.datetime);
                cell.querySelector('.time-date').textContent = dateFormatter.format(dt);
                cell.querySelector('.time-value').textContent = timeFormatter.format(dt);
            });
        }

        formatDates();

        document.body.addEventListener('scheduleRefreshed', function() {
            htmx.trigger('#filters', 'change');
        });

        // Jump to now
        document.getElementById('jump-to-now').addEventListener('click', function() {
            const rows = document.querySelectorAll('tr[data-upcoming="true"]');
            let target = null;

            // Find first live event, or first upcoming
            for (const row of rows) {
                if (row.classList.contains('live')) {
                    target = row;
                    break;
                }
                if (!target) {
                    target = row;
                }
            }

            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('highlight');
                setTimeout(() => target.classList.remove('highlight'), 2000);
            }
        });

        // Re-init after HTMX swap
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target.id === 'schedule-table') {
                formatDates();
            }
        });
    </script>
</body>
</html>
